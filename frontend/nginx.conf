# Розміщення: frontend/nginx.conf
# Конфігурація Nginx для подачі React-SPA з підтримкою client-side routing.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA-routing: будь-який невідомий шлях віддає index.html,
    # щоб React Router міг обробити його на клієнті.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Тривале кешування статичних ресурсів зі змінним хешем у назві
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Безпечні заголовки
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
